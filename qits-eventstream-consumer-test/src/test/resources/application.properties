# A stand-in consumer that publishes and nothing else. The outbox store is a real postgres
# (EmbeddedStore, zonky, never a container); everything that would act behind a test's back is off.
quarkus.devservices.enabled=false
quarkus.http.test-port=0
quarkus.scheduler.enabled=false
qits.eventstream.catchup-at-startup=false

# This consumer's own `qits` client (qits-1328), configured exactly as a consuming service does it:
# the library reads it through OidcClients and has no client settings of its own.
# RecordingEventsServer answers the token endpoint.
quarkus.oidc-client.qits.auth-server-url=${qits.test.idp.url:http://127.0.0.1:1/idp}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=test-qits-eventstream-consumer
quarkus.oidc-client.qits.credentials.secret=test-secret
quarkus.oidc-client.qits.grant.type=client
quarkus.oidc-client.qits.early-tokens-acquisition=false
