# A stand-in consumer that publishes and nothing else. The outbox store is a real postgres
# (EmbeddedStore, zonky, never a container); everything that would act behind a test's back is off.
quarkus.devservices.enabled=false
quarkus.http.test-port=0
quarkus.scheduler.enabled=false
qits.eventstream.catchup-at-startup=false
