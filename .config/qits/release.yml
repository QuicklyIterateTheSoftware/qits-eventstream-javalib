archetype: maven-library
# TWO MODULES, ONE RELEASE (qits-1163). The library, and the contracts kit a consuming service adds at
# test scope to pact what the library sends qits-events on its behalf. The kit LINKS the library: it
# stays an ordinary pom dependency instead of being bundled into the kit's jar, and the two publish
# together. The reactor parent (qits-eventstream-parent) is not published and not declared.
#
# No `contracts:` any more: this library pacts nothing itself. A call a library makes for a service
# is pacted by that service, as `pacts/<service>_qits-eventstream-javalib_qits-events-service.json`,
# built with eu.wohlben.qits:qits-eventstream-contracts. No golden masters either: this library
# serves no REST API.
artifacts:
  - { type: maven, name: "eu.wohlben.qits:qits-eventstream", path: qits-eventstream, sbom: qits-eventstream/target/sbom.json }
  - { type: maven, name: "eu.wohlben.qits:qits-eventstream-contracts", path: qits-eventstream-contracts, sbom: qits-eventstream-contracts/target/sbom.json, link: [qits-eventstream] }
